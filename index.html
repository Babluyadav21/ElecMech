<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <title>ElecMech Engineering Solutions | Electrical Panels & Industrial Automation</title>
    <meta
      name="description"
      content="ElecMech Engineering Solutions manufactures, supplies and exports control panels, automation solution systems, electrical panels and LT distribution boards for industrial clients."
    />
    <meta name="robots" content="index, follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ElecMech Engineering Solutions" />
    <meta property="og:title" content="ElecMech Engineering Solutions | Electrical Panels & Industrial Automation" />
    <meta
      property="og:description"
      content="Powering Industries with Smart Engineering Solutions. Control panels, automation systems and engineering services built for industrial reliability."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
